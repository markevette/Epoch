name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  image:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Update the server when one is named
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          EPOCH_PUBLIC_URL: ${{ secrets.EPOCH_PUBLIC_URL }}
          EPOCH_ADMIN_EMAIL: ${{ secrets.EPOCH_ADMIN_EMAIL }}
          EPOCH_ADMIN_PASSWORD: ${{ secrets.EPOCH_ADMIN_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_HOST}" ] || [ -z "${DEPLOY_USER}" ] || [ -z "${DEPLOY_SSH_KEY}" ]; then
            echo "No server is connected. The private image is the update."
            echo "Add DEPLOY_HOST, DEPLOY_USER, and DEPLOY_SSH_KEY when the website has a machine."
            exit 0
          fi
          if [ -z "${EPOCH_ADMIN_EMAIL}" ] || [ -z "${EPOCH_ADMIN_PASSWORD}" ]; then
            echo "The server needs EPOCH_ADMIN_EMAIL and EPOCH_ADMIN_PASSWORD as repository secrets."
            exit 1
          fi
          image="$(printf '%s' "ghcr.io/${GH_REPOSITORY}:latest" | tr '[:upper:]' '[:lower:]')"
          umask 077
          keyfile="$(mktemp)"
          envfile="$(mktemp)"
          trap 'rm -f "$keyfile" "$envfile"' EXIT
          printf '%s\n' "${DEPLOY_SSH_KEY}" > "$keyfile"
          escape() { printf '%s' "$1" | sed 's/\$/\$\$/g'; }
          {
            printf 'EPOCH_IMAGE=%s\n' "$(escape "$image")"
            printf 'EPOCH_ADMIN_EMAIL=%s\n' "$(escape "$EPOCH_ADMIN_EMAIL")"
            printf 'EPOCH_ADMIN_PASSWORD=%s\n' "$(escape "$EPOCH_ADMIN_PASSWORD")"
            printf 'EPOCH_PUBLIC_URL=%s\n' "$(escape "$EPOCH_PUBLIC_URL")"
          } > "$envfile"
          ssh_opts=(-i "$keyfile" -o StrictHostKeyChecking=accept-new)
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh "${ssh_opts[@]}" "$target" "mkdir -p /opt/epoch && chmod 700 /opt/epoch"
          scp "${ssh_opts[@]}" docker-compose.server.yml "$target:/opt/epoch/docker-compose.yml"
          scp "${ssh_opts[@]}" "$envfile" "$target:/opt/epoch/.env"
          ssh "${ssh_opts[@]}" "$target" "chmod 600 /opt/epoch/.env"
          printf '%s' "${GH_TOKEN}" | ssh "${ssh_opts[@]}" "$target" "docker login ghcr.io -u ${GH_ACTOR} --password-stdin"
          ssh "${ssh_opts[@]}" "$target" "cd /opt/epoch && docker compose --env-file .env pull && docker compose --env-file .env up -d --no-build"
